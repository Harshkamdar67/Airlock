name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify release tag is on main
        shell: bash
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            printf 'Release refused: origin/main was not fetched.\n' >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            printf 'Release refused: tag %s does not point to a commit on main.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Verify version and tests
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            printf 'Tag %s does not match VERSION %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          bash -n bin/airlock \
            scripts/setup.sh scripts/install.sh scripts/doctor.sh \
            plugins/airlock/scripts/agent-guard.sh \
            plugins/airlock/scripts/secret-guard.sh \
            plugins/airlock/scripts/update-notice.sh \
            plugins/airlock/scripts/worktree-create.sh \
            plugins/airlock/scripts/worktree-remove.sh \
            tests/stub-claude.sh tests/test-airlock.sh tests/test-setup.sh
          python -m py_compile \
            bin/airlock-access.py \
            bin/airlock_policy.py \
            bin/airlock_openrouter_auth.py \
            bin/airlock_openrouter_presets.py \
            bin/airlock_openrouter_models.py \
            bin/airlock-router.py \
            bin/airlock-hybrid.py \
            plugins/airlock/scripts/agent-guard.py \
            plugins/airlock/scripts/update-notice.py \
            scripts/test-sol-long-context.py \
            tests/test-live-context.py \
            tests/test-setup-pty.py \
            tests/test-update-notice.py
          python tests/test-access.py
          python tests/test-agent-guard.py
          python tests/test-openrouter-policy.py
          python tests/test-openrouter-auth.py
          python tests/test-openrouter-models.py
          python tests/test-openrouter-access.py
          python tests/test-router.py
          python tests/test-hybrid.py
          python tests/test-secret-guard.py
          python tests/test-worktree.py
          python tests/test-platform.py
          python tests/test-release.py
          python tests/test-update.py
          python tests/test-update-notice.py
          python tests/test-docs.py
          python tests/test-live-context.py
          bash tests/test-airlock.sh
          bash tests/test-setup.sh
          python tests/test-setup-pty.py
          bash tests/test-install.sh
          python scripts/update-bundle.py --check
          git diff --check

      - name: Build source archives
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="airlock-${version}/" \
            --output="dist/airlock-${version}.tar.gz" \
            HEAD
          git archive \
            --format=zip \
            --prefix="airlock-${version}/" \
            --output="dist/airlock-${version}.zip" \
            HEAD
          cd dist
          sha256sum airlock-* > SHA256SUMS

      - name: Attest archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/airlock-*.tar.gz
            dist/airlock-*.zip
            dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          options=(--verify-tag --generate-notes)
          if [[ "$version" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${options[@]}"
