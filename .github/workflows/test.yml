name: test

on:
  # Branch pushes are covered by the pull request run. Running both also made
  # the macOS and Windows jobs fetch every branch, where two branch names that
  # differ only in case collide on a case-insensitive filesystem.
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n bin/airlock \
            scripts/setup.sh scripts/install.sh scripts/doctor.sh \
            plugins/airlock/scripts/agent-guard.sh \
            plugins/airlock/scripts/secret-guard.sh \
            plugins/airlock/scripts/update-notice.sh \
            plugins/airlock/scripts/worktree-create.sh \
            plugins/airlock/scripts/worktree-remove.sh \
            tests/stub-claude.sh tests/test-airlock.sh tests/test-setup.sh \
            tests/test-install.sh

      - name: Check Python and JSON syntax
        shell: bash
        run: |
          python -m py_compile \
            bin/airlock-access.py bin/airlock_policy.py \
            bin/airlock_openrouter_auth.py bin/airlock_openrouter_presets.py \
            bin/airlock_openrouter_models.py \
            bin/airlock-update.py bin/airlock-router.py bin/airlock-hybrid.py \
            plugins/airlock/scripts/agent-guard.py \
            plugins/airlock/scripts/secret-guard.py \
            plugins/airlock/scripts/update-notice.py \
            plugins/airlock/scripts/file_safety.py \
            plugins/airlock/scripts/worktree.py scripts/update-bundle.py \
            tests/test-access.py tests/test-agent-guard.py \
            tests/test-openrouter-policy.py tests/test-openrouter-auth.py \
            tests/test-openrouter-models.py tests/test-openrouter-access.py \
            tests/test-router.py tests/test-hybrid.py tests/test-worktree.py \
            tests/test-secret-guard.py tests/test-platform.py tests/test-release.py \
            tests/test-update.py tests/test-update-notice.py tests/test-docs.py tests/test-live-context.py \
            tests/test-setup-pty.py scripts/test-sol-long-context.py
          for catalog in config/*-agents.json; do
            python -m json.tool "$catalog" >/dev/null
          done
          python -m json.tool config/managed-bundle.json >/dev/null
          python -m json.tool plugins/airlock/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/airlock/hooks/hooks.json >/dev/null
          python scripts/update-bundle.py --check

      - name: Run Python tests
        shell: bash
        run: |
          python tests/test-access.py
          python tests/test-agent-guard.py
          python tests/test-openrouter-policy.py
          python tests/test-openrouter-auth.py
          python tests/test-openrouter-models.py
          python tests/test-openrouter-access.py
          python tests/test-router.py
          python tests/test-hybrid.py
          python tests/test-secret-guard.py
          python tests/test-worktree.py
          python tests/test-platform.py
          python tests/test-release.py
          python tests/test-update.py
          python tests/test-update-notice.py
          python tests/test-docs.py
          python tests/test-live-context.py

      # Git Bash spawns processes slowly, so these suites take about four
      # minutes on a Windows runner and a slower run used to trip a five
      # minute limit. The job timeout above still bounds a hung suite.
      - name: Run Bash launcher tests
        shell: bash
        timeout-minutes: 12
        run: bash tests/test-airlock.sh

      - name: Run setup shell tests
        shell: bash
        timeout-minutes: 12
        run: bash tests/test-setup.sh

      - name: Run setup PTY tests
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 8
        run: python -u tests/test-setup-pty.py

      - name: Run the POSIX installer test
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/test-install.sh

      - name: Run native Windows tests
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test-windows.ps1

      - name: Test a clean worktree
        shell: bash
        run: |
          temp_root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
          fi
          worktree="$temp_root/airlock-clean-worktree"
          git worktree add --detach "$worktree" HEAD
          python "$worktree/tests/test-platform.py"
          bash "$worktree/tests/test-airlock.sh"
          git worktree remove --force "$worktree"

      - name: Check patches
        shell: bash
        run: git diff --check
